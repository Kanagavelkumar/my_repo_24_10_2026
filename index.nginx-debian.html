<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <h1>Welcome to My Web Page</h1>
    <p>This is a simple paragraph of text on your new website.</p>

    <h2>Important Elements</h2>
    <ul>
        <li><strong>Headings:</strong> Used for titles (h1 to h6).</li>
        <li><strong>Paragraphs:</strong> Used for regular text blocks (p).</li>
        <li><strong>Lists:</strong> Used to organize points clearly.</li>
    </ul>

    <p>You can also add a <a href="https://www.w3schools.com" target="_blank">link to another website</a> if you want.</p>

</body>
</html>
